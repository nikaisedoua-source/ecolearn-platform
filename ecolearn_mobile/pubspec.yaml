name: ecolearn
description: "EcoLearn - Plateforme éducative IA gratuite pour les concours d'ingénieur en environnement."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.1.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Database & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drift: ^2.13.0
  sqlite3_flutter_libs: ^0.5.0
  
  # Networking
  dio: ^5.3.1
  web_socket_channel: ^2.4.0
  connectivity_plus: ^5.0.0
  
  # UI & Design
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  lottie: ^2.6.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.0.1
  
  # Audio
  audioplayers: ^5.1.0
  flutter_tts: ^4.0.2
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.0.0
  logger: ^2.1.0
  shared_preferences: ^2.2.2
  permission_handler: ^11.4.4
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1
  
  # Image handling
  image_picker: ^1.0.4
  image_cropper: ^5.0.1
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  
  # PDF & Documents
  pdf: ^3.10.5
  printing: ^5.11.0
  
  # Authentication
  jwt_decoder: ^2.0.1
  
  # Analytics
  firebase_core: ^2.24.2
  firebase_analytics: ^10.7.0
  
  # Development
  cupertino_icons: ^1.0.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  drift_dev: ^2.13.0
  riverpod_generator: ^2.3.7
  custom_lint: ^4.1.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/data/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600